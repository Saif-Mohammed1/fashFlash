services:
  next_app:
    depends_on:
      mongodb:
        condition: service_healthy # Wait for MongoDB to be healthy
    env_file:
      - .env
  mongodb:
    image: mongo
    ports:
      - "27017:27017"
    restart: always
    volumes:
      - mongodb_data:/data/db
    env_file:
      - .env
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--username",
          "root",
          "--password",
          "example",
          "--eval",
          "db.adminCommand('ping')",
        ]
      interval: 10s
      timeout: 10s
      retries: 5

volumes:
  mongodb_data:
